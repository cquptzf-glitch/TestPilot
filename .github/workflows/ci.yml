name: unit-and-ui

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: unit-and-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python unit + ruff
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        shell: pwsh
        run: python -m pip install -e ".[dev,rpc]"
      - name: Verify
        shell: pwsh
        run: python tools/verify.py

  desktop:
    name: Desktop TypeScript build
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: testpilot/app/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
